[project]
name = "resume-assist-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # import sorting
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "DTZ",              # naive datetimes - load-bearing for this app
    "ASYNC",            # async correctness
    "S",                # security
    "T20",              # no stray print()
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends()/Query() in defaults is the framework's API
    "S101",    # assert is fine in tests and internal invariants
    # The CRM dialect REQUIRES typographic characters as grammar: en dash in
    # every date range, em dash between company and location, middle dot before
    # a title's dates. "Fixing" these to ASCII would break the parser.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "DTZ"]
# A CLI entry point talks to the operator on stdout.
"app/db/schema.py" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path",
    "fastapi.Body", "fastapi.Form", "fastapi.File",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The database engine is a module-level singleton, so its pooled connections
# belong to whichever event loop created them. A loop per test would leave
# connections bound to a closed loop; one loop for the session matches.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
